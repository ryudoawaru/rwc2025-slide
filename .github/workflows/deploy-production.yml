name: Deploy to Production (rwc2025.ryudo.tw)

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '5xruby.css'
      - 'images/**'
      - '.github/workflows/deploy-production.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Generate HTML from slides
        run: |
          mkdir -p output

          # Remove Speaker Notes from Markdown before generating HTML
          perl -0777 -pe 's/<!--\s*\nSpeaker Note:.*?-->\s*\n//gs' slide-ja.md > output/slide-ja-no-notes.md
          perl -0777 -pe 's/<!--\s*\nSpeaker Note:.*?-->\s*\n//gs' rubyjam.md > output/rubyjam-no-notes.md
          perl -0777 -pe 's/<!--\s*\nSpeaker Note:.*?-->\s*\n//gs' rubyjam-en.md > output/rubyjam-en-no-notes.md

          # Generate Japanese version (default/main) from cleaned Markdown
          npx @marp-team/marp-cli output/slide-ja-no-notes.md \
            --theme 5xruby.css \
            --html \
            --allow-local-files \
            -o output/index.html

          # Generate English version (slide-en.md already has no Speaker Notes)
          npx @marp-team/marp-cli slide-en.md \
            --theme 5xruby.css \
            --html \
            --allow-local-files \
            -o output/en.html

          # Generate RubyJam Chinese version from cleaned Markdown
          npx @marp-team/marp-cli output/rubyjam-no-notes.md \
            --theme 5xruby.css \
            --html \
            --allow-local-files \
            -o output/rubyjam.html

          # Generate RubyJam English version from cleaned Markdown
          npx @marp-team/marp-cli output/rubyjam-en-no-notes.md \
            --theme 5xruby.css \
            --html \
            --allow-local-files \
            -o output/rubyjam-en.html

          # Remove temporary Markdown files
          rm output/slide-ja-no-notes.md output/rubyjam-no-notes.md output/rubyjam-en-no-notes.md

          # Copy assets to output directory
          if [ -d "images" ]; then
            cp -r images output/
          fi

          if [ -f "5xruby.css" ]; then
            cp 5xruby.css output/
          fi

          # Create a simple listing page for other formats
          cat > output/README.md << 'EOF'
          # RubyWorld Conference 2025 - Slides

          ## RubyWorld Conference 2025

          - [日本語版 (Japanese)](index.html) - Main presentation
          - [English Version](en.html) - English presentation

          ## RubyJam 2025

          - [中文版 (Chinese)](rubyjam.html) - RubyJam presentation
          - [English Version](rubyjam-en.html) - RubyJam English presentation

          ## Source

          - [Markdown Source (Japanese)](https://github.com/ryudoawaru/rwc2025-slide/blob/main/slide-ja.md)
          - [Markdown Source (English)](https://github.com/ryudoawaru/rwc2025-slide/blob/main/slide-en.md)
          - [Markdown Source (RubyJam Chinese)](https://github.com/ryudoawaru/rwc2025-slide/blob/main/rubyjam.md)
          - [Markdown Source (RubyJam English)](https://github.com/ryudoawaru/rwc2025-slide/blob/main/rubyjam-en.md)

          ## About

          This presentation demonstrates how to apply Compiler Theory to Natural Language Processing
          through a pure parser-based implementation for Taiwanese Pe̍h-ōe-jī (POJ) romanization.

          **Achievement**: 🏆 100% parsing accuracy on 64,554 real-world corpus entries

          ---

          © 2025 5xRuby CO., LTD
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Production deployment completed!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📍 Custom domain: https://rwc2025.ryudo.tw (if configured)"
          echo "🔧 Commit: ${{ github.sha }}"
